name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      # Full history: the test suite runs here, and the agent finalize gate
      # clones target repos at --depth=20. A depth-1 grafted checkout (the
      # default) made a git-history-based test pass the gate but fail CI
      # (HEAD has no parent → diff resolved to the whole tree). Fetching full
      # history makes CI's git env a superset of the agent clone, removing
      # that gate-vs-CI divergence. See memory: finalize-clone-depth-vs-ci.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  terraform-format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform fmt -check -recursive infra
