name: Agent images

on:
  push:
    branches: [main]
    paths:
      - "agents/ba/**"
      - "agents/dev/**"
      - "agents/test/**"
      - "agents/functional/**"
      - "agents/security/**"
      - "agents/po/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/agent-images.yml"
  workflow_dispatch:
    inputs:
      role:
        description: "agent role to (re)build"
        required: true
        default: ba
        type: choice
        options: [ba, dev, test, functional, security, po]

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: "076124126225"
  ENV_NAME: dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [ba, dev, test, functional, security, po]

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::076124126225:role/agent-forge-gha-bootstrap
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agents/${{ matrix.role }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/agent-forge-${{ env.ENV_NAME }}/${{ matrix.role }}:latest
            ${{ steps.ecr.outputs.registry }}/agent-forge-${{ env.ENV_NAME }}/${{ matrix.role }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=${{ matrix.role }}
          provenance: false

      - name: Print image URI
        run: |
          echo "Pushed:"
          echo "  ${{ steps.ecr.outputs.registry }}/agent-forge-${{ env.ENV_NAME }}/${{ matrix.role }}:latest"
          echo "  ${{ steps.ecr.outputs.registry }}/agent-forge-${{ env.ENV_NAME }}/${{ matrix.role }}:sha-${{ github.sha }}"
