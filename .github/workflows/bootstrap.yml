name: Bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan or apply"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

concurrency:
  group: bootstrap
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/bootstrap

    env:
      AWS_REGION: eu-west-1
      STATE_BUCKET: agent-forge-tfstate-076124126225-eu-west-1
      LOCK_TABLE: agent-forge-tflock

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::076124126225:role/agent-forge-gha-bootstrap
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
          terraform_wrapper: false

      - name: Detect whether state backend already exists
        id: state
        run: |
          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
          fi

      # First-run only: remove the S3 backend block so plan/apply can run
      # against local state. The bucket it references doesn't exist yet.
      - name: Disable S3 backend block (pre-bootstrap)
        if: steps.state.outputs.bootstrapped == 'false'
        run: mv backend.tf backend.tf.disabled

      - name: Init (pre-bootstrap, local state)
        if: steps.state.outputs.bootstrapped == 'false'
        run: terraform init -input=false

      - name: Init (post-bootstrap, S3 backend)
        if: steps.state.outputs.bootstrapped == 'true'
        run: |
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Validate
        run: terraform validate

      - name: Plan
        if: inputs.mode == 'plan'
        run: terraform plan -input=false

      - name: Apply
        if: inputs.mode == 'apply'
        run: terraform apply -input=false -auto-approve

      # First apply only: bring back the S3 backend block, then migrate the
      # local state into the bucket the apply just created.
      - name: Restore S3 backend block (first apply only)
        if: inputs.mode == 'apply' && steps.state.outputs.bootstrapped == 'false'
        run: mv backend.tf.disabled backend.tf

      - name: Migrate state to S3 (first apply only)
        if: inputs.mode == 'apply' && steps.state.outputs.bootstrapped == 'false'
        run: |
          terraform init -input=false -force-copy -migrate-state \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$LOCK_TABLE" \
            -backend-config="encrypt=true"
