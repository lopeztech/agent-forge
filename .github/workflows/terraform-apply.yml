name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "infra/envs/dev/**"
      - "infra/modules/**"
      - "infra/glue/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/terraform-*.yml"
      - ".terraform-version"
  workflow_dispatch:
    inputs:
      env:
        description: "env to apply"
        required: true
        default: dev
        type: choice
        options: [dev]

permissions:
  id-token: write
  contents: read

concurrency:
  group: tf-apply-${{ github.event.inputs.env || 'dev' }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    env:
      ENV: ${{ github.event.inputs.env || 'dev' }}
      AWS_REGION: eu-west-1
      STATE_BUCKET: agent-forge-tfstate-076124126225-eu-west-1
      LOCK_TABLE: agent-forge-tflock

    defaults:
      run:
        working-directory: infra/envs/${{ github.event.inputs.env || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::076124126225:role/agent-forge-gha-bootstrap
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0
          terraform_wrapper: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm deps
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Build glue Lambdas
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in infra/glue/*/package.sh; do
            echo "::group::$(dirname "$pkg")"
            bash "$pkg"
            echo "::endgroup::"
          done

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=envs/$ENV/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$LOCK_TABLE" \
            -backend-config="encrypt=true"

      - name: Apply
        run: terraform apply -input=false -auto-approve
